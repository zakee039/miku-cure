<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miku Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      color: #2c3e50;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Layout ──────────────────────────────── */
    .shell {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Left Sidebar Navigation ─────────────── */
    .sidebar {
      width: 140px;
      background: #ffffff;
      border-right: 1px solid #e4e8ee;
      display: flex;
      flex-direction: column;
      padding: 12px 0;
      gap: 2px;
      flex-shrink: 0;
    }

    .sidebar-label {
      font-size: 10px;
      font-weight: 600;
      color: #9ba8b8;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 14px 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 500;
      color: #5a6a7e;
      cursor: pointer;
      border-radius: 0;
      border-left: 3px solid transparent;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .nav-item:hover {
      background: #f0f4fa;
      color: #2c3e50;
    }

    .nav-item.active {
      background: #eaf6f5;
      color: #39c5bb;
      border-left-color: #39c5bb;
      font-weight: 600;
    }

    .nav-icon {
      font-size: 14px;
      width: 18px;
      text-align: center;
      flex-shrink: 0;
    }

    /* ── Right Content Panel ─────────────────── */
    .content {
      flex: 1;
      padding: 20px 22px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .page {
      display: none;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .page.active {
      display: flex;
    }

    .page-title {
      font-size: 15px;
      font-weight: 700;
      color: #1a2535;
      padding-bottom: 10px;
      border-bottom: 1px solid #e4e8ee;
    }

    /* ── Form Controls ───────────────────────── */
    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: #6b7a8d;
      margin-bottom: 8px;
      display: block;
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .radio-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1.5px solid #e4e8ee;
      background: #ffffff;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .radio-option:hover {
      border-color: #39c5bb;
      background: #f5fffe;
    }

    .radio-option input[type="radio"] {
      margin-top: 1px;
      accent-color: #39c5bb;
      cursor: pointer;
      flex-shrink: 0;
    }

    .radio-option input[type="radio"]:checked + .option-text .option-name {
      color: #39c5bb;
    }

    .option-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .option-name {
      font-size: 12px;
      font-weight: 600;
      color: #2c3e50;
      transition: color 0.2s;
    }

    .option-desc {
      font-size: 10px;
      color: #9ba8b8;
      line-height: 1.3;
    }

    .tip {
      font-size: 10px;
      color: #b0bec8;
      line-height: 1.5;
      padding: 8px 10px;
      background: #f9fbfd;
      border-radius: 6px;
      border: 1px solid #e8edf2;
    }

    /* ── About page ──────────────────────────── */
    .about-logo {
      font-size: 32px;
      text-align: center;
      margin-bottom: 4px;
    }

    .about-name {
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      color: #1a2535;
    }

    .about-ver {
      font-size: 10px;
      text-align: center;
      color: #9ba8b8;
      margin-top: 2px;
    }

    .about-desc {
      font-size: 11px;
      color: #6b7a8d;
      text-align: center;
      line-height: 1.5;
      padding: 0 10px;
    }

    .about-link {
      font-size: 11px;
      text-align: center;
      color: #39c5bb;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="shell">

    <!-- Left sidebar -->
    <nav class="sidebar">
      <div class="sidebar-label">Settings</div>

      <div class="nav-item active" data-page="model">
        <span class="nav-icon">🧠</span>
        <span>Model</span>
      </div>

      <div class="nav-item" data-page="about">
        <span class="nav-icon">💙</span>
        <span>About</span>
      </div>
    </nav>

    <!-- Right content -->
    <div class="content">

      <!-- Page: Model selection -->
      <div class="page active" id="page-model">
        <div class="page-title">Model Selection</div>

        <div>
          <span class="field-label">Inference Engine</span>
          <div class="radio-group">

            <label class="radio-option">
              <input type="radio" name="model-select" value="cnn" checked>
              <div class="option-text">
                <span class="option-name">Custom PyTorch CNN</span>
                <span class="option-desc">Lightweight self-trained model. Works offline.</span>
              </div>
            </label>

            <label class="radio-option">
              <input type="radio" name="model-select" value="deepface">
              <div class="option-text">
                <span class="option-name">DeepFace (Pretrained)</span>
                <span class="option-desc">Higher accuracy. Requires local model files.</span>
              </div>
            </label>

            <label class="radio-option">
              <input type="radio" name="model-select" value="mock">
              <div class="option-text">
                <span class="option-name">Fallback Simulator</span>
                <span class="option-desc">Brightness-based mock. No camera needed.</span>
              </div>
            </label>

          </div>
        </div>

        <div class="tip">
          Switching the engine triggers a hot-reload in the backend — no restart required.
        </div>
      </div>

      <!-- Page: About -->
      <div class="page" id="page-about">
        <div class="page-title">About</div>
        <div class="about-logo">🎵</div>
        <div class="about-name">Miku Cure</div>
        <div class="about-ver">v0.1.0</div>
        <div class="about-desc">
          A desktop emotion companion powered by real-time facial expression recognition and DeepSeek AI.
        </div>
        <a class="about-link" href="https://github.com/momo325/miku-cure" target="_blank">
          github.com/momo325/miku-cure
        </a>
      </div>

    </div>
  </div>

  <script src="settings_renderer.js"></script>
</body>
</html>
