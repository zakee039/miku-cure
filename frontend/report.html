<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Report</title>
  <link rel="stylesheet" href="report.css">
</head>
<body>
  <div class="report-card">
    <div class="header">
      <div class="header-icon">🤖</div>
      <div class="header-title" id="report-title" data-i18n="report.title">专注周期总结报告</div>
      <div class="close-btn" id="btn-close-icon">✕</div>
    </div>
    <div class="report-subtitle" id="report-period">--:-- ~ --:--</div>
    
    <div class="chart-container">
      <div class="chart-bars" id="chart-bars">
        <!-- Dynamically populated bars -->
      </div>
    </div>

    <div class="report-comment">
      <span class="comment-author" data-i18n="report.miku_says">Miku的话：</span>
      <p class="comment-text" id="report-comment-text" data-i18n="report.loading">加载中...</p>
    </div>

    <div class="action-buttons">
      <button class="action-btn" id="btn-sing"  data-i18n="report.btn_sing">听miku唱歌</button>
      <button class="action-btn" id="btn-dance" data-i18n="report.btn_dance">看miku跳舞</button>
      <button class="action-btn primary" id="btn-analyze" data-i18n="report.btn_analyze">让miku分析</button>
    </div>
  </div>

  <script src="report_renderer.js"></script>
</body>
</html>
