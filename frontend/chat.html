<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miku Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      color: #2c3e50;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border-bottom: 1px solid #e4e8ee;
      padding: 12px 20px;
      flex-shrink: 0;
      font-weight: 600;
      color: #39c5bb;
      font-size: 16px;
    }

    /* ── Chat History ────────────────────────────────────────── */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeIn 0.2s ease;
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.miku {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.user .bubble {
      background: #39c5bb;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.miku .bubble {
      background: #ffffff;
      color: #2c3e50;
      border: 1px solid #e4e8ee;
      border-bottom-left-radius: 4px;
    }

    .chat-bubble-media {
      display: block;
      max-width: 100%;
      border-radius: 8px;
      margin-top: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 14px;
      background: #ffffff;
      border: 1px solid #e4e8ee;
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      margin-bottom: 12px;
      display: none;
    }
    .typing-indicator.active { display: flex; }

    .dot {
      width: 6px;
      height: 6px;
      background: #9ba8b8;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Input Area ────────────────────────────────────────── */
    .input-area {
      display: flex;
      padding: 12px 16px;
      background: #ffffff;
      border-top: 1px solid #e4e8ee;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      color: #2c3e50;
      background: #f4f6f9;
      border: 1.5px solid transparent;
      border-radius: 20px;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input:focus {
      border-color: #39c5bb;
      background: #ffffff;
    }

    .send-btn {
      padding: 0 18px;
      background: #39c5bb;
      color: #ffffff;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }

    .send-btn:hover { opacity: 0.85; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  </style>
</head>
<body>

  <div class="header">
    <span data-i18n="chat.title">与 Miku 聊天</span>
  </div>

  <div class="chat-container" id="chat-history">
    <!-- Dynamic messages -->
    <div class="message miku">
      <div class="bubble" id="welcome-msg" data-i18n="chat.welcome">你好呀！今天感觉怎么样呢？</div>
    </div>
    <div class="typing-indicator" id="typing-indicator">
      <div class="dot"></div><div class=\"dot\"></div><div class="dot"></div>
    </div>
  </div>

  <div class="input-area">
    <input type="text" class="chat-input" id="chat-input" data-i18n-placeholder="chat.placeholder" placeholder="说点什么...">
    <button class="send-btn" id="send-btn" data-i18n="chat.send">发送</button>
  </div>

  <script src="chat_renderer.js"></script>
</body>
</html>
